name: Auto Release ZIP
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files (debug)
        run: ls -la

      - name: Create zip
        run: |
          rm -f project.zip
          zip -r project.zip \
            assets \
            __MACOSX \
            1_21_2 \
            1_21_6 \
            26_1 \
            26_2 \
            26_3 \
            pack.mcmeta \
            pack.png

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
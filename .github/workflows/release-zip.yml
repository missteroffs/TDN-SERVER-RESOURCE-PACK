name: Auto Release ZIP
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP (Minecraft files only)
        run: |
          # รายชื่อไฟล์/โฟลเดอร์ที่เกี่ยวกับ Minecraft datapack/resourcepack
          items=("assets" "data" "pack.mcmeta" "pack.png" "pack.mcpatch")
          
          to_zip=()
          for item in "${items[@]}"; do
            if [ -e "$item" ]; then
              to_zip+=("$item")
            fi
          done

          if [ ${#to_zip[@]} -eq 0 ]; then
            echo "ไม่พบไฟล์ Minecraft ที่ต้องการ zip"
            exit 1
          fi

          zip -r project.zip "${to_zip[@]}"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}